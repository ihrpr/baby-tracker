# Deploys the app to GitHub Pages, injecting the Google identifiers from
# Actions secrets into js/config.js — so they never live in the repository.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject Google identifiers into js/config.js
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_APP_ID: ${{ secrets.GOOGLE_APP_ID }}
        run: |
          for name in GOOGLE_CLIENT_ID GOOGLE_API_KEY GOOGLE_APP_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Actions secret $name is not set"; exit 1
            fi
            sed -i "s|__${name}__|${value}|" js/config.js
          done
          if grep -q '__GOOGLE' js/config.js; then
            echo "::error::placeholder left un-replaced in js/config.js"; exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
